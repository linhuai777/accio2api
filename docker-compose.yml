services:
  accio2api:
    build: .
    image: accio2api:latest
    container_name: accio2api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # ── 服务 ──────────────────────────────────────────
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: info
      DATA_DIR: /data

      # ── 密钥（⚠️ 下列默认值均为公开示例值，生产前必须改）──────
      # ADMIN_KEY：登录 /admin 后台用。没设会拒绝启动（不再自动生成）。
      #   默认 "test" 仅为开箱可用；正式部署务必换成自己的：
      #   python -c "import secrets;print('sk-admin-'+secrets.token_urlsafe(24))"
      ADMIN_KEY: ${ADMIN_KEY:-test}

      # SECRET_KEY：凭证加密密钥，留空自动生成到 /data/.secret_key，务必固定保存
      # SECRET_KEY: xxxxxxxx

      # ── 对外推理密钥：New API 里填这个（留空 = /v1/* 不校验）
      #   默认值为公开示例，生产前必须替换
      API_KEY: ${API_KEY:-sk-9Nh77kKgVaQHr2BrK8HDgWU3Oz1r9W41LaGmoKntkyUjYKXA}

      # ── Accio 站点（一般不用改）
      ACCIO_BASE_URL: https://www.accio.com

      # ── 浏览器（自动注册 / 网页登录必需）
      BROWSER_ENABLED: "true"
      BROWSER_HEADLESS: "true"

      # ── 验证码后端：cloudmail | imap | manual
      OTP_BACKEND: ${OTP_BACKEND:-cloudmail}

      # CloudMail 配置（OTP_BACKEND=cloudmail 时生效）
      CLOUDMAIL_BASE: ${CLOUDMAIL_BASE:-}
      CLOUDMAIL_TOKEN: ${CLOUDMAIL_TOKEN:-}
      CLOUDMAIL_EMAIL: ${CLOUDMAIL_EMAIL:-}
      CLOUDMAIL_PASSWORD: ${CLOUDMAIL_PASSWORD:-}
      CLOUDMAIL_DOMAIN: ${CLOUDMAIL_DOMAIN:-}

      # IMAP 配置（OTP_BACKEND=imap 时生效）
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_SSL: ${IMAP_SSL:-1}
    volumes:
      - ./data:/data
    # Chromium 需要更大的共享内存
    shm_size: "1gb"
